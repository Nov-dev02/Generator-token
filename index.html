<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Nuhsantara License Token Generator</title>
  <style>
    body { background: #070b14; color: #f8fafc; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #0f172a; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    h2 { color: #38bdf8; font-size: 18px; margin-top: 0; text-align: center; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; background: #020617; border: 1px solid #475569; color: white; border-radius: 8px; margin-bottom: 16px; box-sizing: border-box; font-family: monospace; }
    button { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: monospace; }
    button:hover { background: #0369a1; }
    .result { margin-top: 20px; background: #020617; padding: 12px; border: 1px dashed #38bdf8; border-radius: 8px; word-break: break-all; color: #38bdf8; font-size: 12px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔑 Token Generator</h2>
    <label>Pilih Tanggal Kedaluwarsa Lisensi:</label>
    <input type="date" id="inputTanggal">
    
    <button onclick="generateToken()">GENERATE TOKEN PANJANG</button>

    <div class="result" id="outputToken">Token akan muncul di sini...</div>
  </div>

  <script>
    function generateToken() {
      const tglVal = document.getElementById('inputTanggal').value;
      if (!tglVal) {
        alert('Pilih tanggal dulu bro!');
        return;
      }

      // Format tanggal YYYYMMDD
      let cleanDateNum = tglVal.replace(/-/g, ''); // Contoh: 20261215
      
      // Bungkus dengan karakter acak panjang tanpa strip
      // Rumus: Random string + reversed date + random string
      let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let randomPrefix = '';
      for (let i = 0; i < 15; i++) randomPrefix += chars.charAt(Math.floor(Math.random() * chars.length));
      
      let randomSuffix = '';
      for (let i = 0; i < 15; i++) randomSuffix += chars.charAt(Math.floor(Math.random() * chars.length));

      // Selipkan tanggal yang dibalik ke tengah-tengah string acak
      let reversedDate = cleanDateNum.split('').reverse().join('');
      
      // Hasil akhir: string panjang acak rapat tanpa tanda strip (-)
      let finalToken = randomPrefix + reversedDate + randomSuffix;
      
      document.getElementById('outputToken').innerText = finalToken;
    }
  </script>
</body>
</html>
